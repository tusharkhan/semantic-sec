services:
  php:
    build:
      context: ./docker
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    image: semantic-sec:dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
