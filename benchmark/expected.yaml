version: 1
cases:
  - id: idor-find-by-id
    app: laravel11-app
    category: idor
    description: "Invoice fetched by raw id with no ownership scope; the safe variant scopes through the user's invoices relation."
    vulnerable:
      route: GET /vuln/invoices/{id}
      symbol: App\Http\Controllers\Vuln\InvoiceController::show
      line: 19
      map: [authentication]
    safe:
      route: GET /safe/invoices/{id}
      symbol: App\Http\Controllers\Safe\InvoiceController::show
      map: [authentication, query_scope]
      candidate: false
  - id: idor-binding-authorize
    app: laravel11-app
    category: idor
    description: "Bound invoice updated while the FormRequest authorize() returns true; the safe variant adds a controller authorize() backed by InvoicePolicy::update comparing user_id."
    vulnerable:
      route: PUT /vuln/invoices/{invoice}
      symbol: App\Http\Controllers\Vuln\InvoiceController::update
      line: 26
      map: [authentication]
    safe:
      route: PUT /safe/invoices/{invoice}
      symbol: App\Http\Controllers\Safe\InvoiceController::update
      map: [authentication, controller_ability]
      candidate: false
  - id: idor-route-can-middleware
    app: laravel11-app
    category: idor
    description: "Invoice PDF served for any bound invoice with no check; the safe route adds can:view,invoice with identical controller code."
    vulnerable:
      route: GET /vuln/invoices/{invoice}/pdf
      symbol: App\Http\Controllers\Vuln\InvoiceController::pdf
      line: 33
      map: [authentication]
    safe:
      route: GET /safe/invoices/{invoice}/pdf
      symbol: App\Http\Controllers\Safe\InvoiceController::pdf
      map: [authentication, route_ability]
      candidate: false
  - id: idor-form-request
    app: laravel11-app
    category: idor
    description: "Project updated while the FormRequest authorize() returns true; the safe FormRequest checks the update ability on the route project."
    vulnerable:
      route: PATCH /vuln/projects/{project}
      symbol: App\Http\Controllers\Vuln\ProjectController::update
      line: 14
      map: [authentication]
    safe:
      route: PATCH /safe/projects/{project}
      symbol: App\Http\Controllers\Safe\ProjectController::update
      map: [authentication, form_request]
      candidate: false
  - id: idor-trivial-policy
    app: laravel11-app
    category: idor
    description: "Comment deleted after authorize('delete'), but CommentPolicy::delete always returns true; the safe ReplyPolicy compares user_id. Line is the delete the policy fails to protect."
    vulnerable:
      route: DELETE /vuln/comments/{comment}
      symbol: App\Http\Controllers\Vuln\CommentController::destroy
      line: 18
      map: [authentication]
    safe:
      route: DELETE /safe/comments/{reply}
      symbol: App\Http\Controllers\Safe\CommentController::destroy
      map: [authentication, controller_ability]
      candidate: false
  - id: idor-has-middleware
    app: laravel11-app
    category: idor
    description: "Document shown with a HasMiddleware controller that only applies auth; the safe controller adds can:view,document for show."
    vulnerable:
      route: GET /vuln/documents/{document}
      symbol: App\Http\Controllers\Vuln\DocumentController::show
      line: 22
      map: [authentication]
    safe:
      route: GET /safe/documents/{document}
      symbol: App\Http\Controllers\Safe\DocumentController::show
      map: [authentication, route_ability]
      candidate: false
  - id: idor-service-layer
    app: laravel11-app
    category: idor
    description: "Controller delegates to DownloadService::find which does Download::findOrFail($id); the safe service scopes by owner_id (depth 1, invisible to the map). Line is the delegating call."
    vulnerable:
      route: GET /vuln/downloads/{id}
      symbol: App\Http\Controllers\Vuln\DownloadController::show
      line: 17
      map: [authentication]
    safe:
      route: GET /safe/downloads/{id}
      symbol: App\Http\Controllers\Safe\DownloadController::show
      map: [authentication]
      candidate: false
  - id: mass-assign-guarded-empty
    app: laravel11-app
    category: mass_assignment
    description: "Account has $guarded = [] and is updated from $request->all(), so plan, balance and is_admin can be overwritten; the safe variant updates a Member with $fillable name/email from validated()."
    vulnerable:
      route: PUT /vuln/account
      symbol: App\Http\Controllers\Vuln\AccountController::update
      line: 14
      map: [authentication]
    safe:
      route: PUT /safe/account
      symbol: App\Http\Controllers\Safe\MemberController::update
      map: [authentication]
      candidate: false
  - id: mass-assign-sensitive-fillable
    app: laravel11-app
    category: mass_assignment
    description: "Team::create($request->all()) with owner_id in $fillable lets the caller pick the owner; the safe variant creates through the user's ownedWorkspaces relation from validated()."
    vulnerable:
      route: POST /vuln/teams
      symbol: App\Http\Controllers\Vuln\TeamController::store
      line: 14
      map: [authentication]
    safe:
      route: POST /safe/workspaces
      symbol: App\Http\Controllers\Safe\WorkspaceController::store
      map: [authentication]
      candidate: false
  - id: insecure-deserialization-cookie
    app: laravel11-app
    category: insecure_deserialization
    description: "unserialize() on the cart cookie allows object injection; the safe variant decodes the cookie with json_decode."
    vulnerable:
      route: PUT /api/vuln/cart
      symbol: App\Http\Controllers\Vuln\CartController::restore
      line: 13
      map: [authentication]
    safe:
      route: PUT /api/safe/cart
      symbol: App\Http\Controllers\Safe\CartController::restore
      map: [authentication]
      candidate: false
  - id: workflow-refund-any-status
    app: laravel11-app
    category: workflow_bypass
    description: "Owner-authorized refund applied to an order in any status; the safe variant aborts with 422 unless the order is paid."
    vulnerable:
      route: POST /vuln/orders/{order}/refund
      symbol: App\Http\Controllers\Vuln\OrderController::refund
      line: 18
      map: [authentication, controller_ability]
    safe:
      route: POST /safe/orders/{order}/refund
      symbol: App\Http\Controllers\Safe\OrderController::refund
      map: [authentication, controller_ability, abort_guard]
      candidate: false
public_routes: []
